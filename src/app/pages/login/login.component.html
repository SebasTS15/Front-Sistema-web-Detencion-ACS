<section class="auth-page section-shell">
  <article class="auth-copy">
    <span class="tag">Acceso clínico</span>
    <h1>Inicia sesión para comenzar una evaluación</h1>
    <p>
      Ingresa las credenciales configuradas para el servicio de detección.
    </p>
    <a routerLink="/" class="text-link">← Volver al inicio</a>
  </article>

  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h2>Iniciar sesión</h2>

    <label>
      Usuario
      <input type="text" autocomplete="username" placeholder="usuario" formControlName="username">
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <small>Ingresa tu usuario.</small>
      }
    </label>

    <label>
      Contraseña
      <input type="password" autocomplete="current-password" placeholder="••••••••" formControlName="password">
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small>La contraseña debe tener al menos 6 caracteres.</small>
      }
    </label>

    <label class="check-row">
      <input type="checkbox" formControlName="rememberSession">
      Mantener sesión iniciada
    </label>

    @if (loginMessage) {
      <p class="form-alert">{{ loginMessage }}</p>
    }

    <button class="primary-btn" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Validando...' : 'Entrar' }}
    </button>
  </form>
</section>
